[project]
name = "deploy-readiness-scanner"
version = "0.1.0"
description = "Preflight checks for deploying an LLM system in a customer environment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Lokesh Pulivarthi" }]
keywords = ["llm", "preflight", "deployment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42",
    "httpx>=0.27",
    "psutil>=5.9",
    "psycopg[binary]>=3.1",
    "pyarrow>=15",
    "pyyaml>=6",
    "rich>=13",
    "sqlalchemy>=2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
drs = "drs.cli:main"

[project.urls]
Homepage = "https://github.com/LXP86050/deploy-readiness-scanner"

[project.entry-points."drs.checks"]
credentials = "drs.checks.connectivity:CredentialsCheck"
endpoint_reach = "drs.checks.connectivity:EndpointReachCheck"
dns_tls = "drs.checks.connectivity:DnsTlsCheck"
proxy_egress = "drs.checks.connectivity:ProxyEgressCheck"
data_profile = "drs.checks.data:DataProfileCheck"
pii = "drs.checks.data:PiiCheck"
documents = "drs.checks.data:DocumentsCheck"
host_runtime = "drs.checks.runtime:HostRuntimeCheck"
llm_probe = "drs.checks.runtime:LlmProbeCheck"
env_secrets = "drs.checks.security:EnvSecretsCheck"
listeners = "drs.checks.security:ListenersCheck"
residency = "drs.checks.security:ResidencyCheck"
prompt_logging = "drs.checks.security:PromptLoggingCheck"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drs = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "examples", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["drs"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "examples"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["psutil", "pyarrow", "pyarrow.parquet", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=drs --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["drs"]
branch = false
